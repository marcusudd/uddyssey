# Runs on every PR and on pushes to main.
# Assumes the repo layout is backend/ + frontend/ — adjust paths if yours differs.
#
# The checks themselves live in .agents/skills/check/check.sh — the same
# script agents and humans run locally. Edit that file, not this one.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
        working-directory: backend
      - run: bash .agents/skills/check/check.sh backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: bash .agents/skills/check/check.sh frontend
